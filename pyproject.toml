[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypowens"
version = "0.2.0"
description = "Async Python wrapper for the Powens (ex-Budget Insight) bank data aggregation API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jérémie Bartoli" }]
keywords = ["powens", "budget-insight", "open-banking", "aggregation", "psd2", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
# La lib publiée ne dépend que de httpx. yfinance (et son arbre pandas/numpy/
# lxml…) n'est utilisé que par app/classify.py, en import paresseux et optionnel :
# il vit dans l'extra [app], pas dans le wheel imposé à tous les consommateurs.
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "time-machine>=2.14",  # horloge figée : les fixtures ne dépendent plus du jour de la CI
    "hypothesis>=6.100",   # tests de propriété sur les parsers de relevés
]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",  # HTML form posts (category overrides)
    "yfinance>=0.2.40",         # enrichissement secteur/pays (app/classify.py)
]

[project.urls]
Homepage = "https://github.com/bartolije/pypowens"
Repository = "https://github.com/bartolije/pypowens"
"Powens API docs" = "https://docs.powens.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/pypowens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The app lives at the repo root and is not installed (it stays out of the wheel),
# so the root must be importable however pytest is invoked — `pytest` alone does
# not add the cwd to sys.path, only `python -m pytest` does.
pythonpath = ["."]
# Un marqueur mal orthographié doit échouer, pas être ignoré en silence.
addopts = "--strict-markers"
filterwarnings = [
    "error",
    # Starlette annonce le passage à httpx2 — hors de notre contrôle.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # pytest-asyncio déprécie sa fixture de politique d'event loop interne.
    "ignore:.*event_loop_policy.*:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
# The published library is fully strict; the app is checked too, but with the
# annotation-coverage flags relaxed (see override below) — real type errors in
# function bodies are caught without demanding annotations everywhere yet.
files = ["src/pypowens", "app"]

# Les modules d'arithmétique financière et de persistance sont tenus au niveau
# strict : c'est là qu'une erreur de type produit un CHIFFRE FAUX, pas une
# exception. Les routers restent au profil allégé ci-dessous (leurs signatures
# sont dictées par FastAPI/Jinja).
[[tool.mypy.overrides]]
module = [
    "app.performance",
    "app.store",
    "app.importer",
    "app.enrich",
    "app.notify",
    "app.wealth",
    "app.helpers",
    "app.classify",
    "app.config",
    "app.state",
    "app.data",
    "app.collector",
    "app.health",
    "app.recurring",
    "app.frequency",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "app.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = "yfinance"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency-injection idiom: Depends()/Query() in argument defaults.
"app/*" = ["B008"]
