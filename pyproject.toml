[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypowens"
version = "0.2.0"
description = "Async Python wrapper for the Powens (ex-Budget Insight) bank data aggregation API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jérémie Bartoli" }]
keywords = ["powens", "budget-insight", "open-banking", "aggregation", "psd2", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",  # HTML form posts (category overrides)
]

[project.urls]
Homepage = "https://github.com/bartolije/pypowens"
Repository = "https://github.com/bartolije/pypowens"
"Powens API docs" = "https://docs.powens.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/pypowens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The app lives at the repo root and is not installed (it stays out of the wheel),
# so the root must be importable however pytest is invoked — `pytest` alone does
# not add the cwd to sys.path, only `python -m pytest` does.
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
# The published library is type-gated; the local app is not (yet).
files = ["src/pypowens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency-injection idiom: Depends()/Query() in argument defaults.
"app/*" = ["B008"]
