name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # setup-uv already provisions a venv and exports VIRTUAL_ENV; installing
      # --system would target the runner's apt-managed Python and fail.
      - name: Install project
        run: uv pip install -e ".[app,dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Types (library only — the app is not type-gated yet)
        run: uv run mypy src/pypowens

      - name: Tests
        run: uv run pytest -q
