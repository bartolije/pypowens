name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # setup-uv already provisions a venv and exports VIRTUAL_ENV; installing
      # --system would target the runner's apt-managed Python and fail.
      # --locked : la CI installe EXACTEMENT uv.lock — une release transitive de
      # httpx/fastapi ne peut plus casser une PR sans commit.
      - name: Install project (locked)
        run: uv sync --locked --extra app --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Types (library strict + app)
        run: uv run mypy src/pypowens app

      # Le seuil empêche la couverture de dériver en silence : les 5 modules à
      # zéro test de l'audit du 12/08 passaient une CI verte.
      - name: Tests (with coverage floor)
        run: uv run pytest -q --cov=app --cov=src/pypowens --cov-fail-under=89
