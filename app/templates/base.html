<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Powens Finance{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    if (localStorage.getItem("pf-hide") !== "0") {
      document.documentElement.classList.add("hide-amounts");
    }
  </script>
</head>
<body>
  <aside class="sidebar">
    <a href="/" class="sidebar-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span>Powens Finance</span>
    </a>
    <nav class="sidebar-nav">
      <a class="sidebar-link {{ 'active' if active == 'synthese' }}" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Synthèse
      </a>
      <a class="sidebar-link {{ 'active' if active == 'recap' }}" href="/patrimoine">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 10h2v7H7zM11 6h2v11h-2zM15 12h2v5h-2z"/></svg>
        Patrimoine
      </a>
      <a class="sidebar-link {{ 'active' if active == 'comptes' }}" href="/comptes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/><path d="M16 12h2"/></svg>
        Comptes
      </a>
      <a class="sidebar-link {{ 'active' if active == 'analysis' }}" href="/analyse">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><path d="M12 2v10l7 4"/></svg>
        Analyse
      </a>
      <a class="sidebar-link {{ 'active' if active == 'recurring' }}" href="/abonnements">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20M8 3v3M16 3v3"/></svg>
        Budget
      </a>
      <a class="sidebar-link {{ 'active' if active == 'performance' }}" href="/performance">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Performance
      </a>
      <a class="sidebar-link {{ 'active' if active == 'import' }}" href="/import">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import
      </a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        {% block topbar_left %}{% endblock %}
      </div>
      <div class="topbar-right">
        <button id="mask-toggle" class="btn-icon" title="Masquer/afficher les montants">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <a class="btn-connect" href="/connect">+ Compléter mon patrimoine</a>
      </div>
    </header>

    <div class="content">
      {% block content %}{% endblock %}
    </div>

    <footer class="app-footer">
      Données via Powens · usage personnel
    </footer>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
